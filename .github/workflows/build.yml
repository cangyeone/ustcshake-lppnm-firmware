name: Build and test firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh tools/test_host.sh
      - run: python -m pip install platformio==6.2.0
      - run: pio run
